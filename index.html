  <h1 class="game-title" onclick="showCredits()"><span class="title-speed">Speed</span><span class="title-mouse">Mouse</span></h1>

    <div class="panel-section">
      <div class="panel-label">Rešitev</div>
      <button id="btnResitev" onclick="window.toggleMazeSolution && window.toggleMazeSolution()">Rešitev</button>
    </div>
    <div class="panel-section">
      <div class="panel-label">Velikost <span id="sizeVal">8</span></div>
      <input type="range" id="sizeSlider" min="6" max="8" value="8" step="1" oninput="
            const s = parseInt(this.value);
            character.width = s;
            character.height = s;
            document.getElementById('sizeVal').textContent = s;
          " />
    </div>
    <div class="panel-section">
      <div class="panel-label">Hitrost <span id="speedVal">2</span></div>
      <input type="range" id="speedSlider" min="1" max="6" value="2" step="0.5" oninput="
            character.speed = parseFloat(this.value);
            document.getElementById('speedVal').textContent = parseFloat(this.value).toFixed(1);
          " />
    </div>
    <button id="btnReset" onclick="resetGame()">&#8635; Reset</button>
    <button id="btnNavodila" onclick="showNavodila()">&#10067; Navodila</button>
  </div>
  <div class="right-panel">

    </div>
    <div class="clocks-block">

    </div>
    <div class="leaderboard">

      <table id="leaderboardTable">
        <thead><tr><th>#</th><th>Čas</th></tr></thead>

    </div>
